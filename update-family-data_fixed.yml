name: Update family data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-family-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Collect 94 family records
        run: python scrape_families.py

      - name: Commit family-data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add family-data.js

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update 2026 family data"

          # main が実行中に更新されていても追従してから push
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
