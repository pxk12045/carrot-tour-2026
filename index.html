<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CARROT TOUR 2026 — 白老F</title>
<style>
:root {
  --bg:#f5f4f1; --card:#fff; --ink:#161616; --muted:#6b6b6b;
  --top10:#137a4d; --top25:#b07900; --top50:#236aa8; --rest:#777;
  --shadow:0 8px 28px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:30;background:rgba(20,20,20,.94);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;backdrop-filter:blur(10px)}
.headline{display:flex;align-items:end;justify-content:space-between;gap:8px}
.venue{font-size:19px;font-weight:800;letter-spacing:.02em}
.time{font-size:12px;color:#ddd;font-weight:700}
.sub{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:11px;color:#ddd}
.tabs{display:flex;gap:6px}
button{font:inherit}
.tab{border:0;border-radius:999px;padding:6px 11px;background:#333;color:#ddd;font-size:12px;font-weight:700}
.tab.active{background:#fff;color:#111}
.top-picks{background:#fff;border-bottom:1px solid #ddd;padding:8px 10px;display:flex;gap:7px;overflow-x:auto;white-space:nowrap;position:sticky;top:80px;z-index:20}
.pick{border:0;border-radius:12px;padding:6px 9px;background:#eef5f1;color:#174c34;font-size:11px;font-weight:800}
.pick b{font-size:13px}
.view{display:none}
.view.active{display:block}
.map-toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 5px}
.legend{font-size:10px;color:#555;display:flex;gap:8px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.zoom{border:1px solid #bbb;background:#fff;border-radius:10px;padding:5px 9px;font-size:11px;font-weight:700}
.map-scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 7px 9px}
.map-stage{position:relative;width:100%;min-width:100%;transition:width .2s ease;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.map-stage.zoomed{width:142%}
.map-stage img{display:block;width:100%;height:auto}
.marker{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:2px solid #fff;color:white;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.3);z-index:5;padding:0}
.marker .no{font-size:12px;line-height:12px}
.marker .rk{font-size:9px;line-height:10px;opacity:.95}
.top10{background:var(--top10)} .top25{background:var(--top25)} .top50{background:var(--top50)} .rest{background:var(--rest)}
.hint{margin:0 10px 10px;background:#fff;border-radius:13px;padding:10px 12px;font-size:12px;color:#555;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.list{padding:9px 10px 20px}
.list-card{background:#fff;border-radius:14px;margin-bottom:8px;padding:10px 12px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.rank-badge{width:42px;height:42px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.list-name{font-size:13px;font-weight:800}
.list-sub{font-size:10px;color:#666;margin-top:2px}
.list-fr{font-size:11px;text-align:right;font-weight:800}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-radius:20px 20px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:.25s ease;max-height:82vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.open{transform:translateY(0)}
.handle{width:42px;height:5px;background:#ccc;border-radius:99px;margin:8px auto 5px}
.sheet-head{padding:5px 14px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet-title{font-size:18px;font-weight:900;line-height:1.2}
.sheet-meta{font-size:11px;color:#666;margin-top:4px}
.star{border:1px solid #bbb;background:#fff;border-radius:12px;padding:7px 10px;font-size:18px}
.star.on{background:#fff4bd;border-color:#d0a300}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 12px 10px}
.metric{background:#f5f5f5;border-radius:12px;padding:8px;text-align:center}
.metric .v{font-size:17px;font-weight:900}
.metric .l{font-size:9px;color:#666;margin-top:2px}
.measure{margin:0 12px 10px;border-top:1px solid #eee;border-bottom:1px solid #eee;padding:9px 2px;font-size:12px;line-height:1.7}
.eval{padding:0 12px 9px}
.eval-row{display:grid;grid-template-columns:48px repeat(4,1fr);gap:5px;align-items:center;margin:6px 0}
.eval-label{font-size:11px;font-weight:800}
.eval-btn{border:1px solid #ccc;background:#fff;border-radius:9px;padding:7px 0;font-weight:800}
.eval-btn.sel{background:#222;color:#fff;border-color:#222}
.memo{padding:0 12px}
.memo textarea{width:100%;min-height:70px;border:1px solid #ccc;border-radius:12px;padding:9px;font-size:14px;resize:vertical}
.close{margin:10px 12px 0;width:calc(100% - 24px);border:0;background:#111;color:#fff;border-radius:12px;padding:11px;font-weight:800}
.footer-note{font-size:9px;color:#777;padding:8px 12px 0}
@media (min-width:600px){body{max-width:430px;margin:0 auto;border-left:1px solid #ddd;border-right:1px solid #ddd}}

.breakdown{padding:0 12px 10px}
.break-title{font-size:11px;font-weight:900;margin:2px 0 7px}
.score-split{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:6px;margin-bottom:10px}
.split-box{background:#f3f6f4;border-radius:12px;padding:8px;text-align:center}
.split-box .sv{font-size:20px;font-weight:900}
.split-box .sl{font-size:9px;color:#666;margin-top:2px}
.split-op{text-align:center;font-weight:900;color:#777}
.factor-note{font-size:9px;color:#777;margin:2px 0 7px;line-height:1.4}
.factor-row{display:grid;grid-template-columns:72px 1fr 42px;gap:7px;align-items:center;margin:6px 0}
.factor-name{font-size:10px;font-weight:800}
.factor-track{height:10px;background:#eee;border-radius:99px;position:relative;overflow:hidden}
.factor-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#bbb}
.factor-bar{position:absolute;top:1px;bottom:1px;border-radius:99px}
.factor-bar.pos{background:#2f855a}
.factor-bar.neg{background:#c05656}
.factor-val{font-size:9px;text-align:right;font-weight:800}
.factor-tabs{display:flex;gap:5px;margin-bottom:5px}
.factor-tab{border:1px solid #ccc;background:white;border-radius:9px;padding:5px 8px;font-size:10px;font-weight:800}
.factor-tab.active{background:#222;color:white;border-color:#222}

.pedigree{margin:0 12px 10px;background:#f7f5ef;border-radius:13px;padding:9px 11px}
.pedigree-title{font-size:10px;font-weight:900;color:#665d4c;margin-bottom:5px}
.pedigree-grid{display:grid;grid-template-columns:42px 1fr;gap:3px 7px;font-size:12px;line-height:1.45}
.pedigree-l{color:#777;font-size:10px;padding-top:1px}
.pedigree-v{font-weight:800}
.rank-sub{font-size:9px;color:#666;margin-top:1px;font-weight:700}
</style>

const byNo = Object.fromEntries(horses.map(h=>[h.no,h]));
const stage = document.getElementById('mapStage');
const list = document.getElementById('list');
let current = null;
const evalItems = ['歩様','脚元','トモ','気性'];
const evalMarks = ['◎','○','△','×'];

function storeKey(no){ return 'carrot2026_p5_'+no; }
function loadState(no){ try{ return JSON.parse(localStorage.getItem(storeKey(no))||'{}'); }catch(e){return {}} }
function saveState(no,s){ localStorage.setItem(storeKey(no),JSON.stringify(s)); }

horses.forEach(h=>{
  const b=document.createElement('button');
  b.className='marker '+h.tier;
  b.style.left=h.x+'%'; b.style.top=h.y+'%';
  b.dataset.no=h.no;
  b.innerHTML=`<span class="no">${h.no}</span><span class="rk">#${h.rank}</span>`;
  b.onclick=()=>openHorse(h.no);
  stage.appendChild(b);
});

[...horses].sort((a,b)=>a.rank-b.rank).forEach(h=>{
  const c=document.createElement('div'); c.className='list-card'; c.dataset.no=h.no;
  c.innerHTML=`<div class="rank-badge ${h.tier}">#${h.rank}</div>
    <div><div class="list-name">No.${h.no} ${h.name}</div>
    <div class="list-sub">${h.sire} / ${h.sex} / ${h.trainer}</div></div>
    <div class="list-fr">FR ${Math.round(h.pred_fr)}kg<br><span style="color:#777">${h.gain>=0?'+':''}${Math.round(h.gain)}kg</span></div>`;
  c.onclick=()=>openHorse(h.no); list.appendChild(c);
});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById(t.dataset.view+'View').classList.add('active');
});
document.querySelectorAll('.pick').forEach(x=>x.onclick=()=>openHorse(Number(x.dataset.no)));

document.getElementById('zoomBtn').onclick=()=>{
  stage.classList.toggle('zoomed');
  document.getElementById('zoomBtn').textContent=stage.classList.contains('zoomed')?'縮小':'拡大';
};

function openHorse(no){
  const h=byNo[no]; current=h;
  document.getElementById('sheetTitle').textContent=`No.${h.no} ${h.name}`;
  document.getElementById('sheetMeta').textContent=`父 ${h.sire} ｜ 母父 ${h.bms} ｜ ${h.sex} ｜ ${h.trainer}`;
  document.getElementById('mRank').textContent='#'+h.rank;
  document.getElementById('mScore').textContent=h.score.toFixed(1);
  document.getElementById('mPrice').textContent=Math.round(h.price).toLocaleString()+'万';
  document.getElementById('mWeight').textContent=Math.round(h.weight)+'kg';
  document.getElementById('mFR').textContent=Math.round(h.pred_fr)+'kg';
  document.getElementById('mGain').textContent=(h.gain>=0?'+':'')+Math.round(h.gain)+'kg';
  document.getElementById('pedSire').textContent=h.sire;
  document.getElementById('pedDam').textContent=h.dam;
  document.getElementById('pedBms').textContent=h.bms;

  document.getElementById('earnIndex').textContent=h.earn_index.toFixed(1);
  document.getElementById('winIndex').textContent=h.win_index.toFixed(1);
  document.getElementById('earnRank').textContent=`94頭中 ${h.earn_rank}位相当`;
  document.getElementById('winRank').textContent=`94頭中 ${h.win_rank}位相当`;

  factorMode='reg';
  document.getElementById('factorReg').classList.add('active');
  document.getElementById('factorCls').classList.remove('active');
  renderFactors();
  document.getElementById('measure').innerHTML=`体高 <b>${h.height.toFixed(1)}</b>cm　胸囲 <b>${h.chest.toFixed(1)}</b>cm　管囲 <b>${h.cannon.toFixed(1)}</b>cm`;
  const s=loadState(no);
  const star=document.getElementById('star'); star.textContent=s.star?'★':'☆'; star.classList.toggle('on',!!s.star);
  document.getElementById('memo').value=s.memo||'';
  renderEval(s.eval||{});
  document.getElementById('sheet').classList.add('open'); document.getElementById('backdrop').classList.add('open');
}
function renderEval(ev){
  const root=document.getElementById('evalRows'); root.innerHTML='';
  evalItems.forEach(item=>{
    const row=document.createElement('div'); row.className='eval-row';
    row.innerHTML=`<div class="eval-label">${item}</div>`;
    evalMarks.forEach(mark=>{
      const b=document.createElement('button'); b.className='eval-btn'+(ev[item]===mark?' sel':''); b.textContent=mark;
      b.onclick=()=>{ const s=loadState(current.no); s.eval=s.eval||{}; s.eval[item]=mark; saveState(current.no,s); renderEval(s.eval); };
      row.appendChild(b);
    });
    root.appendChild(row);
  });
}
document.getElementById('star').onclick=()=>{
  const s=loadState(current.no); s.star=!s.star; saveState(current.no,s);
  document.getElementById('star').textContent=s.star?'★':'☆'; document.getElementById('star').classList.toggle('on',s.star);
};
document.getElementById('memo').addEventListener('input',e=>{
  if(!current)return; const s=loadState(current.no); s.memo=e.target.value; saveState(current.no,s);
});
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); document.getElementById('backdrop').classList.remove('open'); }
document.getElementById('close').onclick=closeSheet; document.getElementById('backdrop').onclick=closeSheet;

let factorMode='reg';
function renderFactors(){
  if(!current)return;
  const root=document.getElementById('factorRows'); root.innerHTML='';
  const entries=Object.entries(current.breakdown).map(([name,v])=>[name,v[factorMode]]);
  const maxAbs=Math.max(...entries.map(x=>Math.abs(x[1])),0.0001);
  entries.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  entries.forEach(([name,val])=>{
    const row=document.createElement('div'); row.className='factor-row';
    const pct=Math.min(50,Math.abs(val)/maxAbs*50);
    const left=val>=0?50:50-pct;
    row.innerHTML=`<div class="factor-name">${name}</div>
      <div class="factor-track"><div class="factor-mid"></div>
      <div class="factor-bar ${val>=0?'pos':'neg'}" style="left:${left}%;width:${pct}%"></div></div>
      <div class="factor-val">${val>=0?'+':''}${val.toFixed(3)}</div>`;
    root.appendChild(row);
  });
}
document.getElementById('factorReg').onclick=()=>{
  factorMode='reg'; document.getElementById('factorReg').classList.add('active');
  document.getElementById('factorCls').classList.remove('active'); renderFactors();
};
document.getElementById('factorCls').onclick=()=>{
  factorMode='cls'; document.getElementById('factorCls').classList.add('active');
  document.getElementById('factorReg').classList.remove('active'); renderFactors();
};
</script>
