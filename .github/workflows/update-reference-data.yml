name: Update reference data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reference-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect dam links and trainer stats
        run: python update_reference_data.py

      - name: Commit reference-data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-data.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update dam links and trainer stats"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
